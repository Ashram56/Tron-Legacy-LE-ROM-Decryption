    tags: trough
    # ROM switch descriptor (0x040f3574, word +0x10) sets bit 0x80 only on switches 21, 22 and 41; it may mean opto/inverted (not verified). Check on hardware.
  s_trough_jam:
    number: 22   # TROUGH JAM
    tags: trough_jam
    # ROM switch descriptor (0x040f3574, word +0x10) sets bit 0x80 only on switches 21, 22 and 41; it may mean opto/inverted (not verified). Check on hardware.
