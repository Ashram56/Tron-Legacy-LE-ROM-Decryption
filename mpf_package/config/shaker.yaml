# Generated from the Stern Tron Legacy LE v1.74 ROM (trn_174h). See ../README.md.
# Shaker motor. The ROM runs it from display effects (and two switch handlers) with
# shaker_run(strength, min_setting): only when setting shaker_motor (adjustment 86: 0 off, 1-3) is
# at least min_setting, never while tilted or in game over (gf_state & 0x310). Strength 1/2/3 is
# about 75/265/1100 ms of motor. Conditions use the machine setting from settings.yaml.
